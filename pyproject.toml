[project]
name = "matflat"
version = "0.1.0"
description = "Flatten deeply nested MATLAB .mat structures into pandas"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas"]

[project.optional-dependencies]
matio = ["mat-io"]
v73 = ["h5py", "mat73"]
all = ["mat-io", "h5py", "mat73", "pymatreader", "scipy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
